<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>Futebol de Botão 3D</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<div id="hud">
  <div id="hud-score">
    <div class="tbadge" style="background:#FFD700"></div>
    <span id="sy">0</span>
    <span style="color:#fff;opacity:.5">×</span>
    <span id="sb">0</span>
    <div class="tbadge" style="background:#87CEEB"></div>
  </div>
  <div class="hud-block">
    <div class="hud-lbl">Tempo</div>
    <div class="hud-val" id="timer-val">1T 05:00</div>
  </div>
  <div class="hud-block">
    <div class="hud-lbl">Posse</div>
    <div class="hud-val" id="poss-val">🟡 Amarelo</div>
  </div>
  <div class="hud-block">
    <div class="hud-lbl">Toques</div>
    <div class="hud-val" id="touch-val">0 / 4</div>
  </div>
</div>

<div id="canvas-wrap"><canvas id="canvas"></canvas></div>
<div id="toast-container"></div>
<div id="gflash"></div>
<div id="cam-btns">
  <button id="cam-overview-btn">📷 Vista de cima</button>
  <button id="cam-goal-left-btn">🥅 Gol amarelo</button>
  <button id="cam-goal-right-btn">🥅 Gol azul</button>
</div>
<div id="zoom-btns">
  <button id="zoom-in-btn" title="Zoom in (scroll ↑)">+</button>
  <button id="zoom-out-btn" title="Zoom out (scroll ↓)">−</button>
  <button id="reset-view-btn" title="Resetar câmera">⌂</button>
</div>

<!-- ── Pre-game menu ── -->
<div id="menu-overlay">
  <div class="menu-box">

    <!-- Header -->
    <div class="menu-header">
      <div class="menu-title">FUTEBOL DE <span class="menu-title-gold">BOTÃO 3D</span></div>
    </div>

    <!-- Team VS section -->
    <div class="menu-vs-section">

      <div class="menu-team-side" id="team1-side">
        <button class="team-nav-btn" onclick="window.cycleTeam(1,-1)">‹</button>
        <div class="team-showcase">
          <div class="team-badge-xl" id="team1-badge"></div>
          <div class="team-name-xl" id="team1-name">Flamengo</div>
          <div class="team-side-label">TIME 1 · ESQUERDA</div>
        </div>
        <button class="team-nav-btn" onclick="window.cycleTeam(1,1)">›</button>
      </div>

      <div class="menu-vs-divider">
        <div class="vs-line"></div>
        <div class="vs-text">VS</div>
        <div class="vs-line"></div>
      </div>

      <div class="menu-team-side" id="team2-side">
        <button class="team-nav-btn" onclick="window.cycleTeam(2,-1)">‹</button>
        <div class="team-showcase">
          <div class="team-badge-xl" id="team2-badge"></div>
          <div class="team-name-xl" id="team2-name">Palmeiras</div>
          <div class="team-side-label">TIME 2 · DIREITA</div>
        </div>
        <button class="team-nav-btn" onclick="window.cycleTeam(2,1)">›</button>
      </div>

    </div>

    <!-- Compact settings bar -->
    <div class="menu-settings-bar">
      <div class="setting-group">
        <div class="setting-lbl">MODO</div>
        <div class="setting-tabs">
          <button class="stab selected" data-group="mode" data-value="standard" onclick="window.stabSelect(this)">⚽ Botão</button>
          <button class="stab" data-group="mode" data-value="society" onclick="window.stabSelect(this)">🏟️ Fut7</button>
          <button class="stab" data-group="mode" data-value="showbol" onclick="window.stabSelect(this)">🏐 Showbol</button>
        </div>
      </div>
      <div class="setting-group">
        <div class="setting-lbl">BOLA</div>
        <div class="setting-tabs">
          <button class="stab selected" data-group="ball" data-value="sphere" onclick="window.stabSelect(this)">⚽ Bola</button>
          <button class="stab" data-group="ball" data-value="cube" onclick="window.stabSelect(this)">🎲 Dado</button>
        </div>
      </div>
      <div class="setting-group">
        <div class="setting-lbl">REGRAS</div>
        <div class="setting-tabs">
          <button class="stab selected" data-group="rule" data-value="4-toques" onclick="window.stabSelect(this)">4️⃣ 4 Toques</button>
          <button class="stab" data-group="rule" data-value="12-toques" onclick="window.stabSelect(this)">🔢 12 Toques</button>
        </div>
      </div>
      <div class="setting-group">
        <div class="setting-lbl">TEMPO</div>
        <div class="setting-tabs">
          <button class="stab" data-group="time" data-value="5" onclick="window.stabSelect(this)">5 min</button>
          <button class="stab selected" data-group="time" data-value="7" onclick="window.stabSelect(this)">7 min</button>
          <button class="stab" data-group="time" data-value="10" onclick="window.stabSelect(this)">10 min</button>
        </div>
      </div>
    </div>

    <button class="menu-start-btn" onclick="window.startGame()">⚽ JOGAR</button>
  </div>
</div>

<div id="overlay">
  <div class="obox">
    <div class="otitle" id="otitle">INTERVALO</div>
    <div class="osub" id="osub">Placar parcial</div>
    <div class="oscr">
      <span class="ty" id="osy">0</span>
      <span style="color:#fff"> × </span>
      <span class="tb" id="osb">0</span>
    </div>
    <button class="obtn" id="obtn">Continuar</button>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/cannon.js/0.6.2/cannon.min.js"></script>
<script>
  window.selectedMode  = 'standard';
  window.selectedBall  = 'sphere';
  window.selectedRule  = '4-toques';
  window.selectedTime  = 7;
  window.selectedTeam1 = 'flamengo';
  window.selectedTeam2 = 'palmeiras';
  window.team1Index    = 0;
  window.team2Index    = 1;
  window.gameInitialized = false;
  window.gameModule    = null;

  window.updateTeamDisplay = function(slot) {
    if (!window.TEAMS) return;
    var idx  = slot === 1 ? window.team1Index : window.team2Index;
    var team = window.TEAMS[idx];
    if (!team) return;

    var side  = document.getElementById('team' + slot + '-side');
    var badge = document.getElementById('team' + slot + '-badge');
    var nameEl = document.getElementById('team' + slot + '-name');

    if (badge) {
      badge.style.background = team.css;
      badge.style.boxShadow  = '0 0 28px ' + team.css + '99, 0 0 56px ' + team.css + '33';
      badge.style.borderColor = team.css;
    }
    if (nameEl) {
      nameEl.textContent  = team.name;
      nameEl.style.textShadow = '0 0 18px ' + team.css + '99';
    }
    if (side) {
      var grad = slot === 1
        ? 'linear-gradient(to right, ' + team.css + '28 0%, ' + team.css + '06 100%)'
        : 'linear-gradient(to left,  ' + team.css + '28 0%, ' + team.css + '06 100%)';
      side.style.background = grad;
      side.style.borderTop  = '2px solid ' + team.css + '70';
    }

    if (slot === 1) window.selectedTeam1 = team.id;
    else            window.selectedTeam2 = team.id;
  };

  window.cycleTeam = function(slot, dir) {
    if (!window.TEAMS) return;
    var n     = window.TEAMS.length;
    var other = slot === 1 ? window.team2Index : window.team1Index;
    var idx   = slot === 1 ? window.team1Index : window.team2Index;
    var tries = 0;
    do {
      idx = ((idx + dir) % n + n) % n;
      tries++;
    } while (idx === other && tries < n);
    if (slot === 1) window.team1Index = idx;
    else            window.team2Index = idx;
    window.updateTeamDisplay(slot);
  };

  window.stabSelect = function(btn) {
    var group = btn.dataset.group;
    document.querySelectorAll('.stab[data-group="' + group + '"]').forEach(function(b) {
      b.classList.remove('selected');
    });
    btn.classList.add('selected');
    if (group === 'mode') window.selectedMode = btn.dataset.value;
    if (group === 'ball') window.selectedBall = btn.dataset.value;
    if (group === 'rule') window.selectedRule = btn.dataset.value;
    if (group === 'time') window.selectedTime = parseInt(btn.dataset.value);
  };

  window.startGame = function() {
    document.getElementById('menu-overlay').classList.add('hidden');
    if (window.gameModule && window.gameModule.initGame) {
      var ruleMode = window.selectedRule === '12-toques'
        ? window.gameModule.RULE_MODES.TWELVE_TOUCHES
        : window.gameModule.RULE_MODES.FOUR_TOUCHES;
      var m = window.selectedMode;
      var gameMode = m === 'society' ? window.gameModule.GAME_MODES.SOCIETY
                   : m === 'showbol' ? window.gameModule.GAME_MODES.SHOWBOL
                   : window.gameModule.GAME_MODES.STANDARD;

      var t1 = window.TEAMS ? window.TEAMS.find(function(t){ return t.id === window.selectedTeam1; }) : null;
      var t2 = window.TEAMS ? window.TEAMS.find(function(t){ return t.id === window.selectedTeam2; }) : null;
      var teamConfig = (t1 && t2) ? { left: t1, right: t2 } : null;

      window.gameModule.initGame(ruleMode, window.selectedBall, gameMode, window.selectedTime * 60, teamConfig);
      window.gameInitialized = true;

      if (t1 && t2) {
        var badges = document.querySelectorAll('.tbadge');
        badges[0].style.background = t1.css;
        badges[1].style.background = t2.css;
        document.getElementById('sy').style.color = t1.css;
        document.getElementById('sb').style.color = t2.css;
        document.getElementById('cam-goal-left-btn').textContent  = '🥅 ' + t1.name;
        document.getElementById('cam-goal-right-btn').textContent = '🥅 ' + t2.name;
      }
    }
  };
</script>
<script type="module">
  import { initGame, RULE_MODES, GAME_MODES } from '/js/main.js';
  import { TEAMS } from '/js/teams.js';

  window.gameModule = { initGame, RULE_MODES, GAME_MODES };
  window.TEAMS = TEAMS;

  window.team1Index = TEAMS.findIndex(function(t) { return t.id === window.selectedTeam1; });
  window.team2Index = TEAMS.findIndex(function(t) { return t.id === window.selectedTeam2; });
  if (window.team1Index < 0) window.team1Index = 0;
  if (window.team2Index < 0) window.team2Index = 1;

  window.updateTeamDisplay(1);
  window.updateTeamDisplay(2);
</script>
</body>
</html>
